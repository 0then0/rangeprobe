version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: "build(deps)"
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /lab/rustfs
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: "build(deps)"
    groups:
      lab-go-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
